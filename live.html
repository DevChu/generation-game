<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>全場連線模式｜跨世代團康</title>
  <link rel="stylesheet" href="live.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1 class="brand">跨世代團康・全場連線</h1>
      <span class="pill"><i id="connectionDot" class="dot"></i><span id="connectionText">準備連線</span></span>
    </header>

    <section id="setupPanel" class="panel">
      <h2>建立現場房間</h2>
      <p class="muted">參加者掃描 QR Code、輸入暱稱後即可同步回答 4 題。</p>
      <button id="createRoom" class="primary">建立新房間</button>
      <p id="setupError" class="error"></p>
    </section>

    <section id="roomPanel" class="hidden">
      <div id="joinLobby" class="panel lobby">
        <div>
          <div class="muted">請掃描 QR Code，或輸入房號</div>
          <div id="roomCode" class="room-code">----</div>
          <div id="joinUrl" class="join-url muted"></div>
        </div>
        <div id="qrCode" class="qr-wrap"></div>
      </div>

      <section id="participantPanel" class="panel participant-panel" style="margin-top:18px">
        <div class="participant-head">
          <h2>已加入名單</h2>
          <div class="stats compact-stats">
            <div class="stat"><span class="muted">已加入</span><strong id="joinedCount">0</strong></div>
            <div class="stat"><span class="muted">本題已作答</span><strong id="answeredCount">0</strong></div>
          </div>
        </div>
        <div class="participant-legend"><span><i class="legend-dot answered"></i>已作答</span><span><i class="legend-dot"></i>等待作答</span></div>
        <div id="participantNames" class="participant-names"><span class="muted">等待參加者加入…</span></div>
      </section>

      <section id="questionPanel" class="panel" style="margin-top:18px">
        <div id="waitingMessage">
          <h2>等待大家加入</h2>
          <p class="muted">確認人數後，按下方「開始第 1 題」。</p>
        </div>
        <div id="questionContent" class="hidden">
          <div id="questionMeta" class="question-meta"></div>
          <h2 id="questionText" class="question"></h2>
          <section id="representativeAnswerPanel" class="representative-picker hidden">
            <h2 id="representativePrompt">請選擇代表的答案</h2>
            <div id="representativeOptions" class="answer-grid"></div>
            <button id="submitRepresentative" class="primary" disabled>送出並公布</button>
          </section>
          <div id="revealColumns" class="reveal-columns hidden">
            <section id="leaderboard" class="leaderboard">
              <h2>累積分數前三名</h2>
              <div id="podium" class="podium"></div>
              <p class="muted score-rule">每題最高 1,500 分：正確度最高 1,000 分，60 秒內依速度最高加 500 分。</p>
            </section>
            <section id="correctPanel" class="correct-panel">
              <h2>本題答對 <span id="correctCount">0</span> 人</h2>
              <div id="correctNames" class="correct-names"></div>
              <button id="showMoreCorrect" class="ghost hidden">顯示更多…</button>
            </section>
          </div>
          <div id="questionOptions" class="options"></div>
          <div id="resultBars" class="bars hidden"></div>
        </div>
      </section>

      <section class="panel host-controls">
        <div class="actions">
          <button id="startQuestion" class="primary">開始第 1 題</button>
          <button id="lockQuestion" class="secondary" disabled>鎖定作答</button>
          <button id="revealQuestion" class="primary" disabled>公布結果</button>
          <button id="nextQuestion" class="secondary" disabled>下一題</button>
          <button id="endRoom" class="danger">結束活動</button>
          <button id="fullscreen" class="ghost">全螢幕</button>
        </div>
        <p id="hostHint" class="muted">建立房間後即可邀請參加者。</p>
        <p id="hostError" class="error"></p>
      </section>
    </section>
  </main>

  <section id="finaleOverlay" class="finale-overlay hidden" aria-live="polite">
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <div class="finale-content">
      <div class="finale-kicker">跨世代團康挑戰賽</div>
      <h1>最終排行榜</h1>
      <div id="finalPodium" class="final-podium"></div>
      <div class="finale-actions">
        <button id="replayFinale" class="primary">再播放一次</button>
        <button id="closeFinale" class="ghost">關閉頒獎畫面</button>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="live-questions.js"></script>
  <script src="live-common.js"></script>
  <script src="live-host.js"></script>
</body>
</html>
